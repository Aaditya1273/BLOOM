# Foundry is used for property-based fuzzing and invariant testing (test/foundry).
# Hardhat remains the primary build/test/deploy toolchain.
[profile.default]
src = "contracts"
test = "test/foundry"
out = "out-forge"
cache_path = "cache-forge"
libs = ["node_modules", "lib"]
solc_version = "0.8.28"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/=node_modules/@openzeppelin/",
  "@account-abstraction/=node_modules/@account-abstraction/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 1000

[invariant]
runs = 128
depth = 64
fail_on_revert = false
